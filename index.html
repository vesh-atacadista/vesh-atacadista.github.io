<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vesh Atacadista</title><meta name="theme-color" content="#072138"><script>(function(){var t;try{t=localStorage.getItem('pmp_theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.dataset.theme=t})();</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#072138;--sf:#0c2b4a;--sf2:#0f3256;--ink:#f1f5fa;--mut:#9db3cc;--ln:#1a416b;--cu:#1e9bff;--ok:#2fbf71;--wn:#f2b13c;--er:#ff6b6b;--fd:Sora,system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb)}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:700 20px var(--fd);letter-spacing:-.02em}.brand em{font-style:normal;color:var(--cu)}
.sp{flex:1}.who{color:var(--mut);font-size:12px}
.btn{border:0;border-radius:8px;background:var(--cu);color:#fff;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--sf2);border:1px solid var(--ln);color:var(--ink)}.btn.s{padding:6px 10px;font-size:13px}
.btn.w{background:#128c4a}.btn.d{background:transparent;border:1px solid var(--dbr);color:var(--er)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}@media(min-width:1280px){.wrap{max-width:1360px}}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{background:var(--cu);border-color:var(--cu);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
.bar input{flex:1 1 200px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}.k b{display:block;font:700 22px var(--fd)}.k span{color:var(--mut);font-size:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;cursor:pointer;align-items:center}
.hd .n{font-weight:600}.hd .m{color:var(--mut);font-size:12px}.hd .t{font:700 16px var(--fd);text-align:right}
.bd{display:none;border-top:1px solid var(--ln);padding:12px 14px;background:var(--sf2)}.card.on .bd{display:block}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid}
.st-novo{color:var(--cu);border-color:var(--cu)}.st-atendimento{color:var(--wn);border-color:var(--wn)}.st-faturado{color:var(--ok);border-color:var(--ok)}.st-cancelado{color:var(--er);border-color:var(--er)}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);font-size:13px}th{color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;font-size:13px;margin-bottom:8px}.g2 span{color:var(--mut)}
.acts select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.login{max-width:360px;margin:12vh auto;padding:0 16px}.login h1{font:700 26px var(--fd);margin:0 0 4px}
.login label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}.login input{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:11px}
.in{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:80px;text-align:right}.in.w{width:100%;text-align:left}.who{color:var(--mut)}
.err{color:var(--er);font-size:13px;margin-top:10px}.empty{color:var(--mut);padding:30px;text-align:center}
.demo{background:var(--demo-bg);border-bottom:1px solid var(--demo-ln);color:var(--wn);font-size:12px;padding:6px 16px;text-align:center}
@media(max-width:520px){.hd{grid-template-columns:1fr}.hd .t{text-align:left}}

:root{color-scheme:dark;--demo-bg:#2a2410;--demo-ln:#5a4a14;--dbr:#5a2a2a;--toast:#1f3a8a}
:root[data-theme=light]{color-scheme:light;--bg:#f2f5f9;--sf:#ffffff;--sf2:#eef3f9;--ink:#0d2238;--mut:#54697f;--ln:#d2dce8;--cu:#0a6cc4;--ok:#14804a;--wn:#9a6200;--er:#c13a3a;--demo-bg:#fff6dc;--demo-ln:#e6cf8a;--dbr:#e5b5b5;--toast:#0d2238}
html{-webkit-text-size-adjust:100%}
.btn.ic{padding:6px 9px;display:inline-flex;align-items:center;justify-content:center}.btn.ic svg{width:18px;height:18px}
.top{flex-wrap:wrap}.card{overflow-x:auto}.bd{overflow-x:auto}.tab .ti{margin-right:6px;display:inline-block}.tab .ti svg{width:16px;height:16px;vertical-align:-3px}
@media(max-width:640px){
 .top{padding:10px 12px;gap:8px}.top img{height:38px!important}.top .who{display:none}
 .wrap{padding:12px}.kp{gap:8px}.k{padding:10px}.k b{font-size:19px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
 .tab{white-space:nowrap;flex:0 0 auto}
 .bar>input{flex:1 1 100%}.bar>select,.bar>.btn{flex:1 1 auto}
 table{min-width:520px}
 .btn,.in,.bar input,.bar select{min-height:40px}.btn.s{min-height:36px}
 .acts>*{flex:1 1 auto}.g2{grid-template-columns:1fr}
 .hd{padding:10px 12px}
}
</style>

  if(/^QUANT/i.test(s))k='qty';else if(/UNIT/i.test(s))k='unit';else if(/^(V\.?\s*)?DESC\.?$/i.test(s))k='vdesc';else if(/TOTAL/i.test(s))k='total';else if(/IPI/i.test(s))k='ipi'+(++ipiN);else if(/^UN/i.test(s))k='un';else if(/CFOP|CST/i.test(s))k='cf';else if(/ICMS|^B\.?\s*C/i.test(s))k='x';

async function impFiles(files){
 IMP=IMP||{rows:[],step:'pick',forn:''};IMP.msg='';IMP.err=false;
 for(const f of files){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  try{IMP.busy='Lendo '+f.name+'…';draw();let r=null;
   if(ext==='xml')r=parseXML(await f.text());
   else if(ext==='pdf')r=await lePDF(f);
   else if(/^(png|jpe?g|webp|bmp)$/.test(ext)){const url=URL.createObjectURL(f);const t=await ocrImagem(url,'Lendo a foto (OCR)');r={rows:parseTexto(t),info:'Foto lida por OCR',ocr:true}}
   else if(/^(xlsx|xls|csv|ods)$/.test(ext)){IMP.sheet=await leSheet(f);IMP.step='map';IMP.file=f.name;IMP.busy='';draw();return}
   else throw new Error('Formato não suportado: .'+ext+'. Use XML, PDF, foto (JPG/PNG) ou planilha (XLSX/CSV).');
   if(!r.rows.length)throw new Error('Não encontrei itens em '+f.name+'.'+(r.ocr?' A foto precisa estar nítida e inteira; prefira o XML ou o PDF original.':' Tente o XML da nota ou uma planilha.'));
   r.rows.forEach(x=>{const d=impDup(x);x.dup=d?d.cod:null});
   IMP.rows=IMP.rows.concat(r.rows);IMP.step='review';IMP.info=(IMP.info?IMP.info+' + ':'')+r.info;IMP.ocr=IMP.ocr||r.ocr;
   if(!IMP.forn)IMP.forn=(r.rows[0]||{}).forn||'';

async function offImg(ean){try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(ean)+'.json?fields=image_front_url,image_url');if(!r.ok)return '';const j=await r.json(),p=j.product||{};return p.image_front_url||p.image_url||''}catch(e){return ''}}
async function cldUp(f){const fd=new FormData();fd.append('file',f);fd.append('upload_preset',CLD.preset);fd.append('folder','vesh/produtos');const r=await fetch('https://api.cloudinary.com/v1_1/'+CLD.cloud+'/image/upload',{method:'POST',body:fd});if(!r.ok)throw new Error('envio '+r.status);return (await r.json()).secure_url}
function miniatura(f,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.8))};im.onerror=()=>no(new Error('imagem inválida'));im.src=u})}
async function fotoArquivo(f){try{return await cldUp(f)}catch(e){return await miniatura(f,360)}}
async function webImgs(q){const u=window.PM_FB&&window.PM_FB.imgApi;if(!u)return null;const r=await fetch(u+(u.includes('?')?'&':'?')+'q='+encodeURIComponent(q));if(!r.ok)throw new Error('busca '+r.status);return ((await r.json()).images||[]).slice(0,12)}
async function imgsEAN(){let n=0;IMP.busy='Buscando imagens pelo EAN…';draw();
 for(const r of IMP.rows){if(r.foto||!r.ean)continue;const u=await offImg(r.ean);if(u){r.foto=u;n++}}
 IMP.busy='';IMP.msg=n?n+' imagem(ns) encontrada(s) pelo código de barras. Para os demais, use o botão Imagem de cada item.':'Nenhuma imagem encontrada pelo código de barras. Use o botão Imagem de cada item.';IMP.err=!n;draw()}

 const novos=sel.filter(r=>!r.dup),atu=sel.filter(r=>r.dup&&r.acao==='atualizar');
 const doc=(r,cod)=>({cod,ref:r.ref,n:r.n,forn:r.forn||IMP.forn||'',un:r.un||'un',custo:+r.custo||0,ipi:+r.ipi||0,st:+r.st||0,frete:r.frete===undefined?null:r.frete,desc:+r.desc||0,cred:+r.cred||0,ean:r.ean||'',ncm:r.ncm||'',foto:r.foto||''});
 const upd=r=>{const o={custo:+r.custo||0,ipi:+r.ipi||0,st:+r.st||0,desc:+r.desc||0};const p=PD.find(x=>x.cod===r.dup)||{};if(!p.ean&&r.ean)o.ean=r.ean;if(!p.ncm&&r.ncm)o.ncm=r.ncm;if(!p.foto&&r.foto)o.foto=r.foto;if(r.sheet){if(r.n)o.n=r.n;if(r.forn)o.forn=r.forn;if(r.un)o.un=r.un;if(r.ref)o.ref=r.ref;if(r.ean)o.ean=r.ean;if(r.ncm)o.ncm=r.ncm;if(r.foto)o.foto=r.foto;if(r.frete!==undefined)o.frete=r.frete;if(r.cred!==undefined)o.cred=r.cred}return o};
 try{
  if(DEMO||!DB){let c=prox();novos.forEach(r=>PD.push(doc(r,c++)));atu.forEach(r=>{const i=PD.findIndex(x=>x.cod===r.dup);if(i>=0)PD[i]={...PD[i],...upd(r)}});LS.set('pd',PD)}
  else{
   let ops=[];
   if(novos.length){const n=await novoCod();novos.forEach((r,i)=>ops.push(b=>b.set(DB.collection('produtos').doc(String(n+i)),doc(r,n+i))));ops.push(b=>b.set(DB.collection('config').doc('contador'),{prox:n+novos.length}))}
   atu.forEach(r=>ops.push(b=>b.set(DB.collection('produtos').doc(String(r.dup)),upd(r),{merge:true})));

 catch(e){IMP.err=true;IMP.msg='Não consegui gravar: '+((e&&(e.code||e.message))||'erro')+'.';draw()}}
