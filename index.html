<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#072138;--sf:#0c2b4a;--sf2:#0f3256;--ink:#f1f5fa;--mut:#9db3cc;--ln:#1a416b;--cu:#1e9bff;--ok:#2fbf71;--wn:#f2b13c;--er:#ff6b6b;--fd:Sora,system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--fb)}
button,input,select{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font:700 20px var(--fd);letter-spacing:-.02em}.brand em{font-style:normal;color:var(--cu)}
.sp{flex:1}.who{color:var(--mut);font-size:12px}
.btn{border:0;border-radius:8px;background:var(--cu);color:#fff;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.g{background:var(--sf2);border:1px solid var(--ln);color:var(--ink)}.btn.s{padding:6px 10px;font-size:13px}
.btn.w{background:#128c4a}.btn.d{background:transparent;border:1px solid var(--dbr);color:var(--er)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cu);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:16px}@media(min-width:1280px){.wrap{max-width:1360px}}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--ln);background:var(--sf);border-radius:999px;padding:7px 14px;cursor:pointer}
.tab.on{background:var(--cu);border-color:var(--cu);color:#fff}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 10px;min-width:0}
.bar input{flex:1 1 200px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px}.k b{display:block;font:700 22px var(--fd)}.k span{color:var(--mut);font-size:12px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;margin-bottom:8px;overflow:hidden}
.hd{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;cursor:pointer;align-items:center}
.hd .n{font-weight:600}.hd .m{color:var(--mut);font-size:12px}.hd .t{font:700 16px var(--fd);text-align:right}
.bd{display:none;border-top:1px solid var(--ln);padding:12px 14px;background:var(--sf2)}.card.on .bd{display:block}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;border:1px solid}
.st-novo{color:var(--cu);border-color:var(--cu)}.st-atendimento{color:var(--wn);border-color:var(--wn)}.st-faturado{color:var(--ok);border-color:var(--ok)}.st-cancelado{color:var(--er);border-color:var(--er)}
table{width:100%;border-collapse:collapse;margin:8px 0}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--ln);font-size:13px}th{color:var(--mut);font-weight:500}td.r,th.r{text-align:right}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px;font-size:13px;margin-bottom:8px}.g2 span{color:var(--mut)}
.acts select{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 8px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.login{max-width:360px;margin:12vh auto;padding:0 16px}.login h1{font:700 26px var(--fd);margin:0 0 4px}
.login label{display:block;margin:12px 0 4px;color:var(--mut);font-size:12px}.login input{width:100%;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:11px}
.in{background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:6px 8px;width:80px;text-align:right}.in.w{width:100%;text-align:left}.who{color:var(--mut)}
.err{color:var(--er);font-size:13px;margin-top:10px}.empty{color:var(--mut);padding:30px;text-align:center}
.demo{background:var(--demo-bg);border-bottom:1px solid var(--demo-ln);color:var(--wn);font-size:12px;padding:6px 16px;text-align:center}
@media(max-width:520px){.hd{grid-template-columns:1fr}.hd .t{text-align:left}}

:root{color-scheme:dark;--demo-bg:#2a2410;--demo-ln:#5a4a14;--dbr:#5a2a2a;--toast:#1f3a8a}
:root[data-theme=light]{color-scheme:light;--bg:#f2f5f9;--sf:#ffffff;--sf2:#eef3f9;--ink:#0d2238;--mut:#54697f;--ln:#d2dce8;--cu:#0a6cc4;--ok:#14804a;--wn:#9a6200;--er:#c13a3a;--demo-bg:#fff6dc;--demo-ln:#e6cf8a;--dbr:#e5b5b5;--toast:#0d2238}
html{-webkit-text-size-adjust:100%}
.btn.ic{padding:6px 9px;display:inline-flex;align-items:center;justify-content:center}.btn.ic svg{width:18px;height:18px}
.top{flex-wrap:wrap}.card{overflow-x:auto}.bd{overflow-x:auto}.tab .ti{margin-right:6px;display:inline-block}.tab .ti svg{width:16px;height:16px;vertical-align:-3px}
@media(max-width:640px){
 .top{padding:10px 12px;gap:8px}.top img{height:38px!important}.top .who{display:none}
 .wrap{padding:12px}.kp{gap:8px}.k{padding:10px}.k b{font-size:19px}
 .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.tabs::-webkit-scrollbar{display:none}
 .tab{white-space:nowrap;flex:0 0 auto}
 .bar>input{flex:1 1 100%}.bar>select,.bar>.btn{flex:1 1 auto}
 table{min-width:520px}
 .btn,.in,.bar input,.bar select{min-height:40px}.btn.s{min-height:36px}
 .acts>*{flex:1 1 auto}.g2{grid-template-columns:1fr}
 .hd{padding:10px 12px}
}
@media(max-width:640px){.top{display:grid!important;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 10px}.top .sp,.top .who{display:none!important}.top #thm{grid-column:3;grid-row:1;justify-self:end}.top .badge{justify-self:start}.top #vis{grid-column:1/3;grid-row:2}.top #out{grid-column:3;grid-row:2}.top #vis,.top #out{width:100%;justify-content:center}.top:not(:has(#out)) #vis{grid-column:1/4}.tabs{scroll-snap-type:x proximity}.tab{scroll-snap-align:start}.hello b{font-size:18px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tile b{font-size:13px}.tile small{font-size:10.5px}.tile{padding:16px 6px}}
html,body{background:var(--bg)}
@media(max-width:640px){.top .lg-main{display:none!important}.top .lg-m{display:block!important;height:46px!important;width:auto;background:#fff;padding:6px 14px;border-radius:12px;box-shadow:0 0 0 2px var(--cu)}:root[data-theme=light] .top .lg-main{display:block!important;height:52px!important;box-shadow:0 2px 8px rgba(7,33,56,.3)}:root[data-theme=light] .top .lg-m{display:none!important}}
.top .lg-m{display:none}
@media(max-width:640px){.tabs{display:none!important}.backhome{display:inline-flex!important;align-items:center;margin:0 0 12px;min-height:38px}.kp{display:none!important}}
.backhome{display:none}
</style>
